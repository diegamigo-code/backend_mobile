services:
  db:
    image: postgres:17-alpine
    container_name: wim100-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-wim100}
      POSTGRES_USER: ${DB_USER:-wim100}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - wim100-pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    image: wim100-backend:latest
    container_name: wim100-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-wim100}
      DB_USER: ${DB_USER:-wim100}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-8h}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-Wim100.2026}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  wim100-pgdata:
