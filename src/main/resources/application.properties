spring.application.name=wim100-backend
server.address=${WIM_HOST:127.0.0.1}
server.port=${WIM_PORT:8080}
spring.datasource.url=${WIM_DB_URL:jdbc:mysql://localhost:3306/wim100}
spring.datasource.username=${WIM_DB_USER:wim100}
spring.datasource.password=${WIM_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true
server.servlet.session.tracking-modes=cookie
