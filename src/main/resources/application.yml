spring:
  application:
    name: wim100-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wim100}
    username: ${DB_USER:wim100}
    password: ${DB_PASSWORD:wim100}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:8h}
    issuer: ${JWT_ISSUER:wim100-backend}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  seed:
    enabled: ${SEED_ENABLED:true}
    default-password: ${SEED_DEFAULT_PASSWORD:Wim100.2026}
  candidatas:
    dominios-permitidos: ${DOMINIOS_PERMITIDOS:ejemplo.cl,example.com,test.cl}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.wim100.backend: INFO
